
name: QPACK isolated regression test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qpack-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Kestrel test project without running tests
        shell: bash
        run: |
          ./eng/build.sh \
            --projects "$GITHUB_WORKSPACE/src/Servers/Kestrel/Core/test/Microsoft.AspNetCore.Server.Kestrel.Core.Tests.csproj" \
            --configuration Release \
            --ci \
            --no-test

      - name: Run only the QPACK regression test
        shell: bash
        run: |
          dotnet test \
            "$GITHUB_WORKSPACE/src/Servers/Kestrel/Core/test/Microsoft.AspNetCore.Server.Kestrel.Core.Tests.csproj" \
            --configuration Release \
            --no-build \
            --no-restore \
            --filter "FullyQualifiedName~T0_Block2_OnFreshDecoder_DecodesLiteralA" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=QPACK-targeted.trx" \
            --results-directory "$GITHUB_WORKSPACE/artifacts/TestResults/Targeted"

      - name: Upload QPACK test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QPACK-isolated-results
          path: artifacts/TestResults/Targeted/
          if-no-files-found: warn
