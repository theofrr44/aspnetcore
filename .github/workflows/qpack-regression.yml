
name: QPACK isolated regression test

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Exact Git commit SHA to test'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  qpack-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
      - name: Inject Host test into vulnerable checkout
        if: ${{ inputs.target_ref == '53b1091d150beeb41c255183e95430b1dc9e67fd' }}
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin e7a0beb6be2abf414d19974b59a4276ea73a6b2f

          git show e7a0beb6be2abf414d19974b59a4276ea73a6b2f:src/Servers/Kestrel/test/Interop.FunctionalTests/Http3/Http3RequestTests.cs > src/Servers/Kestrel/test/Interop.FunctionalTests/Http3/Http3RequestTests.cs
      - name: Show tested version
        shell: bash
        run: |
          echo "Requested ref: ${{ inputs.target_ref }}"
          echo "Actual commit: $(git rev-parse HEAD)"
          echo "Decoder Reset implementation:"
          grep -A5 -B1 "public void Reset()" \
            src/Shared/runtime/Http3/QPack/QPackDecoder.cs

      - name: Install MsQuic
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y wget ca-certificates

          wget https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb \
            -O packages-microsoft-prod.deb

          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y libmsquic

          sudo ldconfig
          ldconfig -p | grep -i msquic

          echo "MsQuic installation verified."

      - name: Build Kestrel Core test project
        shell: bash
        run: |
          ./eng/build.sh \
            --projects "$GITHUB_WORKSPACE/src/Servers/Kestrel/Core/test/Microsoft.AspNetCore.Server.Kestrel.Core.Tests.csproj" \
            --configuration Release \
            --ci \
            --no-test

      - name: Run QPACK decoder regression test
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          dotnet test \
            "$GITHUB_WORKSPACE/src/Servers/Kestrel/Core/test/Microsoft.AspNetCore.Server.Kestrel.Core.Tests.csproj" \
            --configuration Release \
            --no-build \
            --no-restore \
            --filter "FullyQualifiedName~Reset_ClearsPendingStaticHeaderName" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=QPACK-decoder-targeted.trx" \
            --results-directory "$GITHUB_WORKSPACE/artifacts/TestResults/Targeted"

      - name: Build Kestrel InMemory test project
        shell: bash
        run: |
          ./eng/build.sh \
            --projects "$GITHUB_WORKSPACE/src/Servers/Kestrel/test/InMemory.FunctionalTests/InMemory.FunctionalTests.csproj" \
            --configuration Release \
            --ci \
            --no-test

      - name: Run QPACK InMemory stream-reuse test
        id: inmemory
        continue-on-error: true
        shell: bash
        run: |
          dotnet test \
            "$GITHUB_WORKSPACE/src/Servers/Kestrel/test/InMemory.FunctionalTests/InMemory.FunctionalTests.csproj" \
            --configuration Release \
            --no-build \
            --no-restore \
            --filter "FullyQualifiedName~IncompleteTrailerHeaders_DoesNotCorruptNextPooledRequest" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=QPACK-stream-reuse.trx" \
            --results-directory "$GITHUB_WORKSPACE/artifacts/TestResults/Targeted"

      - name: Build Kestrel Interop test project
        shell: bash
        run: |
          ./eng/build.sh \
            --projects "$GITHUB_WORKSPACE/src/Servers/Kestrel/test/Interop.FunctionalTests/Interop.FunctionalTests.csproj" \
            --configuration Release \
            --ci \
            --no-test

      - name: Run real QUIC QPACK stream-reuse test
        id: quic
        continue-on-error: true
        shell: bash
        run: |
          set -e

          TEST_NAME="QPack_IncompleteTrailers_StreamReuse_DoesNotRejectHostAuthorityRequest"
          RESULTS="$GITHUB_WORKSPACE/artifacts/TestResults/Targeted"

          dotnet test \
            "$GITHUB_WORKSPACE/src/Servers/Kestrel/test/Interop.FunctionalTests/Interop.FunctionalTests.csproj" \
            --configuration Release \
            --no-build \
            --no-restore \
            --filter "FullyQualifiedName~$TEST_NAME" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=QPACK-msquic-stream-reuse.trx" \
            --results-directory "$RESULTS"

          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          test_name = "QPack_IncompleteTrailers_StreamReuse_DoesNotCorruptNextRequest"
          report = "artifacts/TestResults/Targeted/QPACK-msquic-stream-reuse.trx"

          files = glob.glob(report)

          if not files:
              sys.exit("ERROR: QUIC TRX report was not generated.")

          root = ET.parse(files[0]).getroot()

          results = [
              result for result in root.iter()
              if result.tag.endswith("UnitTestResult")
              and test_name in result.attrib.get("testName", "")
          ]

          if not results:
              sys.exit("ERROR: Target QUIC test was not found.")

          outcome = results[0].attrib.get("outcome")
          print(f"QUIC test outcome: {outcome}")

          if outcome != "Passed":
              sys.exit("ERROR: QUIC test did not pass or was skipped.")

          print("SUCCESS: Real QUIC test executed and passed.")
          PY

      - name: Summarize test results
        if: always()
        shell: bash
        env:
          UNIT_RESULT: ${{ steps.unit.outcome }}
          INMEMORY_RESULT: ${{ steps.inmemory.outcome }}
          QUIC_RESULT: ${{ steps.quic.outcome }}
        run: |
          echo "Unit test: $UNIT_RESULT"
          echo "InMemory test: $INMEMORY_RESULT"
          echo "QUIC test: $QUIC_RESULT"

          if [ "$UNIT_RESULT" != "success" ] || \
             [ "$INMEMORY_RESULT" != "success" ] || \
             [ "$QUIC_RESULT" != "success" ]; then
            echo "One or more regression tests failed."
            exit 1
          fi

          echo "All QPACK regression tests passed."

      - name: Upload QPACK test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QPACK-isolated-results
          path: artifacts/TestResults/Targeted/
          if-no-files-found: warn
