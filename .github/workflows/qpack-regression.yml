
name: QPACK targeted test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qpack-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and run targeted QPACK test
        shell: bash
        run: |
          ./eng/build.sh \
            --projects "$GITHUB_WORKSPACE/src/Servers/Kestrel/Core/test/Microsoft.AspNetCore.Server.Kestrel.Core.Tests.csproj" \
            --test \
            --configuration Release \
            --ci \
            -- /p:TestFilter="FullyQualifiedName~Reset_ClearsPendingStaticHeaderName"
